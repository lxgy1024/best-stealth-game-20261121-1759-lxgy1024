<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>The Amber Star Heist — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, 1152px, calc(100vh * 1152 / 720)); height: auto; aspect-ratio: 1152 / 720; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Amber Star Heist: a top-down stealth game. Move with WASD or arrow keys, sneak with Shift, click to toss a coin. Steal three relics and reach the exit unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
